<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<style>
:root{--bg:#f1f9fd;--card:#fff;--ink:#1d3340;--mut:#5f7886;--ln:#dcecf3;--pr:#2f9fd8;--ac:#3aae93;--pk:#ec6fa0;--am:#f5a623;--vi:#8b6fe8;--bad:#d23b3b}
@media(prefers-color-scheme:dark){:root{--bg:#0d1920;--card:#17262f;--ink:#e8f3f8;--mut:#9fb8c5;--ln:#26404d;--pr:#5cbdf0;--ac:#58cdb0}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,sans-serif;padding-bottom:80px}
.hd{background:linear-gradient(120deg,var(--pr),var(--ac) 60%,var(--vi));color:#fff;padding:12px 14px 0}.hd b{font-size:16px}
nav{display:flex;gap:6px;margin-top:10px}nav button{border:0;background:rgba(255,255,255,.2);color:#fff;border-radius:12px 12px 0 0;padding:8px 16px;font:600 13px system-ui;cursor:pointer}nav button.on{background:var(--bg);color:var(--pr)}
main{padding:12px;max-width:1100px;margin:0 auto}.pos{display:grid;gap:12px}@media(min-width:860px){.pos{grid-template-columns:1.3fr 1fr;align-items:start}}
.c{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:12px;margin-bottom:10px}h3{margin:0 0 8px;font-size:14px}
input,select{width:100%;border:1px solid var(--ln);background:var(--bg);color:var(--ink);border-radius:10px;padding:8px 10px;font:14px system-ui}
.ch{display:flex;gap:6px;overflow-x:auto;margin:8px 0}.ch button,.pm button{border:0;border-radius:99px;padding:6px 13px;font:600 12.5px system-ui;cursor:pointer;background:var(--ln);color:var(--ink);white-space:nowrap}.ch button.on,.pm button.on{background:var(--pr);color:#fff}
.it{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));max-height:52vh;overflow:auto}
.it button{text-align:left;border:1px solid var(--ln);border-left:5px solid var(--cl);background:var(--bg);color:var(--ink);border-radius:12px;padding:9px;cursor:pointer;font:inherit}.it b{display:block;font-size:12.5px}.it span{color:var(--pr);font-weight:700}
.ln{display:grid;grid-template-columns:1fr 92px auto;gap:6px;align-items:center;border-bottom:1px dashed var(--ln);padding:6px 0}.q{display:inline-flex;align-items:center;gap:4px}.q button{width:26px;height:26px;border-radius:50%;border:0;background:var(--pr);color:#fff;font-size:16px;cursor:pointer}
.r{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0}.tot{display:flex;justify-content:space-between;font-size:18px;font-weight:800;color:var(--pr);margin-top:8px}
.b{border:0;border-radius:12px;padding:12px;font:700 14px system-ui;cursor:pointer;background:var(--ac);color:#fff;width:100%}.b.o{background:none;border:1.5px solid var(--pr);color:var(--pr);width:auto;padding:5px 12px;font-size:12.5px}.b.x{border-color:var(--bad);color:var(--bad)}
.pm{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid var(--ln);padding:6px;font-size:13px;text-align:left}th{color:var(--mut);font-size:11px}.w{overflow-x:auto}
.k{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));margin-bottom:10px}.k div{background:var(--card);border:1px solid var(--ln);border-top:4px solid var(--c);border-radius:14px;padding:10px}.k b{font-size:20px;color:var(--c);display:block}
.bar{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:12.5px}.bar span{width:40%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bar i{height:11px;border-radius:6px}.bar b{margin-left:auto}
#rc{display:none}.pl{border-radius:99px;padding:1px 9px;font-size:11px;font-weight:700;color:#fff}
@media print{body>*{display:none!important}#rc{display:block!important;width:58mm;font:11px/1.3 monospace;color:#000;padding:2mm}#rc hr{border:0;border-top:1px dashed #000}#rc div{display:flex;justify-content:space-between}}
</style></head><body>
<div class="hd"><b>🧾 Kasir Asiyah Mom &amp; Baby Care</b><nav id="nav"></nav></div>
<main id="m">Memuat...</main><div id="rc"></div>
<script>
var K=sessionStorage.k||prompt('Kunci kasir'),KS=sessionStorage.ks||prompt('Nama kasir')||'',P,LD=[],TR=[],CFG={},ADM=false,tab='pos',cat='semua',q='',cart={},met='Tunai',CL={kelas:'#8b6fe8',newborn:'#ec6fa0',terapi:'#f5a623',pijat:'#2f9fd8',laktasi:'#3aae93'},CN={kelas:'Kelas & Bumil',newborn:'Newborn',terapi:'Terapi',pijat:'Pijat & Spa',laktasi:'Laktasi'},H=[];
var $=function(i){return document.getElementById(i)},rp=function(n){return'Rp'+Math.round(n||0).toLocaleString('id-ID')},TD=new Date().toLocaleDateString('sv-SE'),F=TD,T=TD;
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function err(e){alert(e.message||e)}
var SM=['Instagram','TikTok','Iklan FB','Teman/keluarga','Tetangga','Lainnya'],IK=['Anteng','Rewel','ASI keluar','ASI lancar','Tidak ada'];
function opt(a,ph){return'<option value="">'+ph+'</option>'+a.map(function(x){return'<option>'+esc(x)+'</option>'}).join('')}
function tt(o,c){var p=+CFG.komisi_persen||0;return'<div class="w"><table><tr><th>Terapis</th><th>Layanan</th><th>Omzet</th><th>Transport</th><th>Tips</th>'+(p?'<th>Komisi '+p+'%</th>':'')+'</tr>'+Object.keys(o).sort(function(a,b){return o[b]-o[a]}).map(function(k){return'<tr><td>'+esc(k)+'</td><td>'+c[k].n+'</td><td>'+rp(o[k])+'</td><td>'+rp(c[k].o)+'</td><td>'+rp(c[k].t)+'</td>'+(p?'<td>'+rp(o[k]*p/100)+'</td>':'')+'</tr>'}).join('')+'</table></div>'}
function init(){google.script.run.withSuccessHandler(function(d){sessionStorage.k=K;sessionStorage.ks=KS;P=d.produk;LD=d.leads;ADM=d.admin;TR=d.terapis||[];CFG=d.cfg||{};render()}).withFailureHandler(function(e){sessionStorage.k='';$('m').textContent=e.message+'. Muat ulang halaman.'}).kasirInit(K)}
function render(){$('nav').innerHTML=[['pos','🛒 Kasir'],['his','📋 Riwayat'],['lap','📈 Laporan']].map(function(t){return'<button class="'+(tab==t[0]?'on':'')+'" onclick="go(\''+t[0]+'\')">'+t[1]+'</button>'}).join('');
 if(tab=='pos')pos();else{$('m').innerHTML=tab=='his'?'<div class="c"><div class="r"><input type="date" id="f" value="'+F+'"><input type="date" id="t" value="'+T+'"></div><button class="b" onclick="muat()">Tampilkan</button></div><div id="out"></div>':'<div class="c"><div class="r"><input type="date" id="f" value="'+F+'"><input type="date" id="t" value="'+T+'"></div><button class="b" onclick="muat()">Tampilkan</button></div><div id="out"></div>';muat()}}
function go(t){tab=t;if(t=='lap'){var d=new Date();d.setDate(1);F=d.toLocaleDateString('sv-SE')}else F=T=TD;render()}
// ---- KASIR ----
function pos(){var cats=['semua'].concat(Object.keys(CN));
 $('m').innerHTML='<div class="pos"><div><div class="c"><input id="sq" placeholder="🔍 Cari layanan..." value="'+esc(q)+'" oninput="q=this.value;list()"><div class="ch">'+cats.map(function(c){return'<button class="'+(cat==c?'on':'')+'" onclick="cat=\''+c+'\';pos()">'+(CN[c]||'Semua')+'</button>'}).join('')+'<button onclick="manual()">+ Item manual</button></div><div class="it" id="li"></div></div></div>'+
 '<div><div class="c"><h3>👤 Pelanggan</h3><select id="ld" onchange="pilihLead(this.value)"><option value="">Pelanggan langsung / pilih dari leads</option>'+LD.map(function(l,i){return'<option value="'+i+'">'+esc(l.nama)+' · '+esc(l.src)+'</option>'}).join('')+'</select><div class="r"><input id="nm" placeholder="Nama"><input id="hp" placeholder="No. WhatsApp" inputmode="tel"></div><select id="lk"><option>Outlet</option><option>Homecare Bandar Lampung</option><option>Homecare luar kota</option></select><div class="r"><select id="tp">'+opt(TR,'Terapis')+'</select><select id="sm">'+opt(SM,'Sumber klien')+'</select></div><div class="r"><input id="pk" placeholder="Pekerjaan"><select id="ik">'+opt(IK,'Info klien')+'</select></div><label class="m">Tanggal layanan</label><input id="tg" type="date" value="'+TD+'"></div>'+
 '<div class="c"><h3>🧺 Keranjang</h3><div id="ct"></div><div class="r"><input id="ds" placeholder="Diskon (20000 atau 10%)" oninput="hit()"><input id="tr" placeholder="Transport" inputmode="numeric" oninput="hit()"></div><input id="tps" placeholder="Tips terapis (opsional, tidak masuk total)" inputmode="numeric" style="margin-bottom:6px"><div class="tot"><span>TOTAL</span><span id="tt">Rp0</span></div>'+
 '<div class="pm">'+['Tunai','QRIS','Transfer','Debit'].map(function(m){return'<button class="'+(met==m?'on':'')+'" onclick="met=\''+m+'\';hit()">'+m+'</button>'}).join('')+'</div><div id="by"></div><input id="cn" placeholder="Catatan (opsional)" style="margin-top:6px"><button class="b" style="margin-top:10px" onclick="simpan(this)">💾 Simpan &amp; cetak struk</button></div></div></div>';
 list();keranjang();hit()}
function list(){var h='';P.forEach(function(p,i){if((cat=='semua'||p.kategori==cat)&&(!q||(p.nama+p.tag).toLowerCase().indexOf(q.toLowerCase())>=0))h+='<button style="--cl:'+(CL[p.kategori]||'#999')+'" onclick="add('+i+')"><b>'+esc(p.nama)+'</b><span>'+rp(p.harga)+'</span></button>'});$('li').innerHTML=h||'<div class="m">Tidak ada layanan</div>'}
function add(i){var c=cart['p'+i]||(cart['p'+i]={nama:P[i].nama,qty:0,harga:P[i].harga});c.qty++;keranjang();hit()}
function manual(){var n=prompt('Nama item'),h=+prompt('Harga (angka)');if(n&&h){cart['m'+Date.now()]={nama:n,qty:1,harga:h};keranjang();hit()}}
function ubah(k,d){cart[k].qty+=d;if(cart[k].qty<1)delete cart[k];keranjang();hit()}
function hrg(k,v){cart[k].harga=+v||0;hit()}
function keranjang(){var ks=Object.keys(cart);$('ct').innerHTML=ks.length?ks.map(function(k){var c=cart[k];return'<div class="ln"><div><b>'+esc(c.nama)+'</b></div><input value="'+c.harga+'" inputmode="numeric" onchange="hrg(\''+k+'\',this.value)"><span class="q"><button onclick="ubah(\''+k+'\',-1)">−</button><b>'+c.qty+'</b><button onclick="ubah(\''+k+'\',1)">+</button></span></div>'}).join(''):'<div style="color:var(--mut)">Ketuk layanan untuk menambah</div>'}
var LS=null;function pilihLead(i){if(i===''){LS=null;return}var l=LD[i];LS=l;$('nm').value=l.nama;$('hp').value=l.hp}
function sub(){return Object.keys(cart).reduce(function(a,k){return a+cart[k].qty*cart[k].harga},0)}
function dis(){var v=($('ds')||{}).value||'',s=sub();return v.indexOf('%')>0?Math.round(s*parseFloat(v)/100):Math.min(+v.replace(/\D/g,'')||0,s)}
function tot(){return sub()-dis()+(+(($('tr')||{}).value)||0)}
function hit(){if(!$('tt'))return;var t=tot();$('tt').textContent=rp(t);document.querySelectorAll('.pm button').forEach(function(b){b.className=b.textContent==met?'on':''});
 $('by').innerHTML=met=='Tunai'?'<input id="bz" placeholder="Uang diterima" inputmode="numeric" oninput="kem()"><div class="pm" style="margin-top:6px"><button onclick="uang('+t+')">Uang pas</button>'+[50000,100000,200000].map(function(v){return'<button onclick="uang('+v+')">'+v/1000+'rb</button>'}).join('')+'</div><div id="km" class="m" style="font-weight:700"></div>':'<div class="m">Pembayaran '+met+' dianggap lunas sebesar total.</div>'}
function uang(v){$('bz').value=v;kem()}function kem(){var d=(+$('bz').value||0)-tot();$('km').innerHTML=d>=0?'Kembalian: <span style="color:var(--ac)">'+rp(d)+'</span>':'<span style="color:var(--bad)">Kurang '+rp(-d)+'</span>'}
function simpan(b){var items=Object.keys(cart).map(function(k){return cart[k]});if(!items.length)return alert('Keranjang kosong');if(!$('tp').value)return alert('Pilih terapis');if(!$('sm').value)return alert('Pilih sumber klien');b.disabled=true;b.textContent='Menyimpan...';
 google.script.run.withSuccessHandler(function(r){b.disabled=false;b.textContent='💾 Simpan & cetak struk';cart={};LS=null;if(r.lead)LD=LD.filter(function(l){return l.r!=r.lead});struk(r);pos()}).withFailureHandler(function(e){b.disabled=false;b.textContent='💾 Simpan & cetak struk';err(e)})
 .kasirSimpan(K,{items:items,diskon:dis(),transport:+$('tr').value||0,metode:met,bayar:+(($('bz')||{}).value)||0,pelanggan:$('nm').value,hp:$('hp').value,lokasi:$('lk').value,catatan:$('cn').value,kasir:KS,lead:LS?LS.r:'',terapis:$('tp').value,sumber:$('sm').value,pekerjaan:$('pk').value,info:$('ik').value,tgl:$('tg').value,tips:+$('tps').value||0})}
// ---- STRUK ----
function struk(r,noprint){var d=new Date(r.waktu).toLocaleString('id-ID',{dateStyle:'short',timeStyle:'short'});
 $('rc').innerHTML='<div style="display:block;text-align:center"><b>ASIYAH MOM &amp; BABY CARE</b><br>Rajabasa, Bandar Lampung<br>WA 0813-8777-7903</div><hr><div><span>'+r.no+'</span><span>'+d+'</span></div>'+(r.pelanggan?'<div><span>Pelanggan</span><span>'+esc(r.pelanggan)+'</span></div>':'')+'<hr>'+
 r.items.map(function(i){return'<div style="display:block">'+esc(i.nama)+'</div><div><span>'+i.qty+' x '+i.harga.toLocaleString('id-ID')+'</span><span>'+(i.qty*i.harga).toLocaleString('id-ID')+'</span></div>'}).join('')+'<hr><div><span>Subtotal</span><span>'+r.sub.toLocaleString('id-ID')+'</span></div>'+(r.dis?'<div><span>Diskon</span><span>-'+r.dis.toLocaleString('id-ID')+'</span></div>':'')+(r.tr?'<div><span>Transport</span><span>'+r.tr.toLocaleString('id-ID')+'</span></div>':'')+'<div><b>TOTAL</b><b>'+r.tot.toLocaleString('id-ID')+'</b></div><div><span>'+r.metode+'</span><span>'+r.bayar.toLocaleString('id-ID')+'</span></div>'+(r.kem?'<div><span>Kembali</span><span>'+r.kem.toLocaleString('id-ID')+'</span></div>':'')+'<hr><div style="display:block;text-align:center">Terima kasih, Bunda 💙<br>Semoga ibu dan si kecil sehat selalu</div>';
 if(!noprint){setTimeout(function(){window.print()},150)}
 if(r.hp&&!noprint&&confirm('Kirim struk ke WhatsApp pelanggan?'))wa(r)}
function wa(r){var t='*Asiyah Mom & Baby Care*\nStruk '+r.no+'\n'+r.items.map(function(i){return'- '+i.nama+' x'+i.qty+' = '+rp(i.qty*i.harga)}).join('\n')+(r.dis?'\nDiskon: -'+rp(r.dis):'')+(r.tr?'\nTransport: '+rp(r.tr):'')+'\n*Total: '+rp(r.tot)+'* ('+r.metode+')\nTerima kasih, Bunda 💙';var h=String(r.hp).replace(/^0/,'62');window.open('https://wa.me/'+h+'?text='+encodeURIComponent(t),'_blank')}
// ---- RIWAYAT & LAPORAN ----
function muat(){F=$('f').value;T=$('t').value;$('out').innerHTML='<div class="c">Memuat...</div>';google.script.run.withSuccessHandler(function(r){H=r;tab=='his'?his():lap()}).withFailureHandler(err).kasirRiwayat(K,F,T)}
function S(r){return{no:r.no,waktu:r.waktu,items:JSON.parse(r.item||'[]'),sub:+r.subtotal,dis:+r.diskon,tr:+r.transport,tot:+r.total,bayar:+r.bayar,kem:+r.kembali,metode:r.metode,pelanggan:r.pelanggan,hp:String(r.hp).replace(/\D/g,'')}}
function his(){var ok=H.filter(function(r){return r.status=='Lunas'}),sum=ok.reduce(function(a,r){return a+(+r.total||0)},0);
 $('out').innerHTML='<div class="k"><div style="--c:#2f9fd8"><b>'+ok.length+'</b>Transaksi</div><div style="--c:#3aae93"><b>'+rp(sum)+'</b>Omzet</div></div><div class="c w"><table><tr><th>No</th><th>Jam</th><th>Pelanggan</th><th>Total</th><th>Bayar</th><th></th></tr>'+(H.length?H.map(function(r,i){var b=r.status=='Batal';return'<tr style="'+(b?'opacity:.5;text-decoration:line-through':'')+'"><td>'+r.no+'</td><td>'+new Date(r.waktu).toLocaleString('id-ID',{dateStyle:'short',timeStyle:'short'})+'</td><td>'+esc(r.pelanggan)+'</td><td>'+rp(r.total)+'</td><td>'+r.metode+'</td><td><button class="b o" onclick="cetak('+i+')">Struk</button> '+(b?'':'<button class="b o x" onclick="vd('+i+')">Void</button>')+'</td></tr>'}).join(''):'<tr><td colspan="6">🍼 Belum ada transaksi</td></tr>')+'</table></div>'}
function cetak(i){var r=S(H[i]);struk(r,true);window.print()}
function vd(i){var a=prompt('Alasan void '+H[i].no+'? (hanya kunci admin)');if(a===null)return;google.script.run.withSuccessHandler(muat).withFailureHandler(err).kasirVoid(K,H[i].no,a)}
function lap(){var ok=H.filter(function(r){return r.status=='Lunas'}),sum=ok.reduce(function(a,r){return a+(+r.total||0)},0),bm={},bl={},bd={},bk={},bt2={},bc={},bs={},tc={};
 ok.forEach(function(r){bm[r.metode]=(bm[r.metode]||0)+ +r.total;var d=r.waktu.slice(0,10);bd[d]=(bd[d]||0)+ +r.total;bk[r.kasir||'-']=(bk[r.kasir||'-']||0)+ +r.total;var tp=r.terapis||'-';bt2[tp]=(bt2[tp]||0)+ +r.total;tc[tp]=tc[tp]||{n:0,o:0,t:0};tc[tp].n++;tc[tp].o+=+r.transport||0;tc[tp].t+=+r.tips||0;bc[r.kategori||'-']=(bc[r.kategori||'-']||0)+ +r.total;bs[r.sumber||'-']=(bs[r.sumber||'-']||0)+ +r.total;JSON.parse(r.item||'[]').forEach(function(i){bl[i.nama]=(bl[i.nama]||0)+i.qty*i.harga})});
 var PAL=['#2f9fd8','#3aae93','#ec6fa0','#f5a623','#8b6fe8','#ef6a5b'];function bars(o){var ks=Object.keys(o).sort(function(a,b){return o[b]-o[a]}).slice(0,8),m=Math.max.apply(null,ks.map(function(k){return o[k]}).concat(1));return ks.map(function(k,i){return'<div class="bar"><span>'+esc(k)+'</span><i style="width:'+Math.max(3,o[k]/m*40)+'%;background:'+PAL[i%6]+'"></i><b>'+rp(o[k])+'</b></div>'}).join('')||'<div class="m">Belum ada data</div>'}
 var bt=H.filter(function(r){return r.status=='Batal'}).length;
 $('out').innerHTML='<div class="k"><div style="--c:#3aae93"><b>'+rp(sum)+'</b>Omzet</div><div style="--c:#2f9fd8"><b>'+ok.length+'</b>Transaksi</div><div style="--c:#8b6fe8"><b>'+rp(ok.length?sum/ok.length:0)+'</b>Rata-rata</div><div style="--c:#ec6fa0"><b>'+rp(ok.reduce(function(a,r){return a+(+r.diskon||0)},0))+'</b>Total diskon</div><div style="--c:#ef6a5b"><b>'+bt+'</b>Void</div></div>'+
 '<div class="c"><h3>💳 Per metode bayar</h3>'+bars(bm)+'</div><div class="c"><h3>🛍️ Layanan terlaris (nilai)</h3>'+bars(bl)+'</div><div class="c"><h3>📅 Per hari</h3>'+bars(bd)+'</div><div class="c"><h3>🧑‍⚕️ Per terapis</h3>'+tt(bt2,tc)+'</div><div class="c"><h3>🗂️ Per kelompok layanan</h3>'+bars(bc)+'</div><div class="c"><h3>📣 Per sumber klien</h3>'+bars(bs)+'</div><div class="c"><h3>🧾 Per kasir</h3>'+bars(bk)+'</div><button class="b" onclick="csv()">⬇️ Unduh CSV</button>'}
function csv(){var l=['no,waktu,pelanggan,metode,subtotal,diskon,transport,total,status,kasir,terapis,sumber,kategori,tips'].concat(H.map(function(r){return[r.no,r.waktu,'"'+String(r.pelanggan).replace(/"/g,'')+'"',r.metode,r.subtotal,r.diskon,r.transport,r.total,r.status,r.kasir,r.terapis,r.sumber,r.kategori,r.tips].join(',')}));var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([l.join('\n')],{type:'text/csv'}));a.download='transaksi-'+F+'_'+T+'.csv';a.click()}
init();
</script></body></html>

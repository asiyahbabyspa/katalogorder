<script>
const $=i=>document.getElementById(i),rp=n=>'Rp'+Math.round(n||0).toLocaleString('id-ID'),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),LS=localStorage,iso=d=>d.toLocaleDateString('sv-SE'),addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const SM=['Instagram','TikTok','Iklan FB','WhatsApp','Teman/keluarga','Tetangga','Lainnya'],IK=['Anteng','Rewel','ASI keluar','ASI lancar','Tidak ada'],PAL=['#2f9fd8','#3aae93','#ec6fa0','#f5a623','#8b6fe8','#ef6a5b'],PRS=[['hari','Hari ini'],['kemarin','Kemarin'],['7','7 hari'],['30','30 hari'],['bulan','Bulan ini'],['lalu','Bulan lalu'],['tahun','Tahun ini'],['kustom','Kustom']];
let KEY=LS.k||'',KS=LS.ks||'',D=Object.assign({produk:[],terapis:[],cfg:{},admin:false},JSON.parse(LS.c||'{}')),tab='pos',cat='semua',q='',cart={},met='Tunai',FP='bulan',FF,FT,H=[],PH=[],TD=[],TGT=+LS.tg||2000000,use=JSON.parse(LS.use||'{}'),flt={t:'',m:'',s:'Lunas',q:''},LDR=false,LOADED=false;
async function api(a,p){const r=await fetch(APP_URL,{method:'POST',body:JSON.stringify(Object.assign({api:a,k:KEY},p))}).then(r=>r.json());if(r.error)throw new Error(r.error);return r.d}
function P(){const r=D.produk&&D.produk.length?D.produk:DEF;r.forEach(p=>{if(!CATS[p.kategori])CATS[p.kategori]=[p.kategori,'🏷️',PAL[Object.keys(CATS).length%6]]});return r}
function rng(p){const t=new Date(),m=t.getMonth(),y=t.getFullYear();return{hari:[t,t],kemarin:[addD(t,-1),addD(t,-1)],7:[addD(t,-6),t],30:[addD(t,-29),t],bulan:[new Date(y,m,1),t],lalu:[new Date(y,m-1,1),new Date(y,m,0)],tahun:[new Date(y,0,1),t]}[p]}
function setP(p){FP=p;if(p!='kustom'){const r=rng(p);FF=iso(r[0]);FT=iso(r[1]);muat()}else render()}
async function start(){if(!KEY){KEY=prompt('Kunci kasir')||'';KS=prompt('Nama kasir')||'';LS.k=KEY;LS.ks=KS}render();try{const d=await api('init');D=d;LS.c=JSON.stringify({produk:d.produk,terapis:d.terapis,cfg:d.cfg,admin:d.admin});render();hariIni();setTimeout(insLoad,2500);setTimeout(crmLoad,1500)}catch(e){if(/kunci/i.test(e.message)){LS.k='';KEY=''}$('app').insertAdjacentHTML('afterbegin','<div class="cd" style="color:var(--bad)">'+esc(e.message)+' (memakai data tersimpan)</div>')}}
async function hariIni(){try{TD=(await api('riwayat',{dari:iso(new Date()),sampai:iso(new Date())})).filter(r=>r.status=='Lunas');if(tab=='pos')render()}catch(e){}}
function render(){if(tab=='ana'&&!D.admin)tab='pos';$('app').innerHTML=`<div class="hd"><div class="hr"><b>🧾 Kasir Asiyah</b><span>${D.admin?'<button class="hb" onclick="insOpen()">🔔<i id="bd"></i></button>':''}<button class="hb" onclick="if(confirm('Ganti kunci kasir?')){LS.k='';location.reload()}">🔑</button></span></div><small>${esc(KS)||'kasir'} · ${new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long'})}</small></div><main id="mn"></main><nav>${[['pos','🛒','Kasir'],['his','📋','Riwayat'],['ana','📈','Analitik'],['kel','⚙️','Kelola']].filter(t=>t[0]!='ana'||D.admin).map(t=>`<button class="${tab==t[0]?'on':''}" onclick="go('${t[0]}')"><span>${t[1]}</span>${t[2]}</button>`).join('')}</nav>`;tab=='pos'?pos():tab=='kel'?kel():(FF||setP(FP),filt());bell()}
function go(t){tab=t;render()}
// ---- INSIGHT BISNIS ----
let INS=JSON.parse(LS.ins||'{"t":0,"l":[]}');const DAYN=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
async function insLoad(f){if(!D.admin)return;if(f!==1&&Date.now()-INS.t<18e5)return;try{const T=new Date(),r=(await api('riwayat',{dari:iso(addD(T,-59)),sampai:iso(T)})).filter(x=>x.status=='Lunas');INS={t:Date.now(),l:insCalc(r)};LS.ins=JSON.stringify(INS);bell()}catch(e){}}
function insCalc(r){if(!r.length)return[{s:0,i:'🧾',c:'#2f9fd8',t:'Belum ada transaksi 60 hari terakhir',d:'Insight muncul otomatis setelah ada data penjualan.',a:[]}];
const L=[],T=new Date(),td=iso(T),dd=x=>iso(new Date(x.waktu)),sum=(a,k)=>a.reduce((s,x)=>s+(+x[k||'total']||0),0),tot=sum(r),avg=tot/r.length;
const om=sum(r.filter(x=>dd(x)==td)),sisa=TGT-om;
L.push(om>=TGT?{s:0,i:'🎉',c:'#22a45d',t:'Target hari ini tercapai',d:'Omzet '+rp(om)+' dari target '+rp(TGT)+'. Setiap tambahan layanan kini jadi bonus.',a:[]}:{s:T.getHours()>=15?2:1,i:'🎯',c:'#f5a623',t:'Sisa '+rp(sisa)+' menuju target',d:'Sekitar '+Math.ceil(sisa/avg)+' transaksi lagi (rata-rata '+rp(avg)+'). Tawarkan paket atau layanan tambahan ke klien hari ini.',a:[]});
const n7=iso(addD(T,-6)),p7=iso(addD(T,-13)),w1=sum(r.filter(x=>dd(x)>=n7)),w0=sum(r.filter(x=>dd(x)>=p7&&dd(x)<n7));
if(w0>0){const g=Math.round((w1-w0)/w0*100);L.push({s:g<=-15?2:g<0?1:0,i:g>=0?'📈':'📉',c:g>=0?'#22a45d':'#d23b3b',t:'Omzet 7 hari '+(g>=0?'naik ':'turun ')+Math.abs(g)+'%',d:rp(w1)+' vs '+rp(w0)+' pada 7 hari sebelumnya.'+(g<0?' Cek hari dan layanan yang melemah.':''),a:g<0?[['Buka Analitik','go','ana']]:[]})}
const cl={};r.forEach(x=>{const h=String(x.hp||'').replace(/\D/g,'').replace(/^0/,'62');if(h.length<9)return;const c=cl[h]=cl[h]||{h,n:x.pelanggan||'Bunda',o:0,l:'0'};c.o+=+x.total||0;if(dd(x)>c.l){c.l=dd(x);c.n=x.pelanggan||c.n}});
const lp=Object.values(cl).map(c=>Object.assign(c,{g:Math.floor((T-new Date(c.l+'T12:00'))/864e5)})).filter(c=>c.g>=21).sort((a,b)=>b.o-a.o);
if(lp.length)L.push({s:1,i:'💬',c:'#8b6fe8',t:lp.length+' klien belum kembali 3+ minggu',d:'Potensi '+rp(lp.reduce((s,c)=>s+c.o,0))+' dari riwayat belanja mereka. Sapa lewat WhatsApp, mulai dari nilai terbesar.',a:lp.slice(0,3).map(c=>['WA '+String(c.n).split(' ')[0],'wa','https://wa.me/'+c.h+'?text='+encodeURIComponent('Halo Bunda '+c.n+', sudah '+Math.round(c.g/7)+' minggu sejak kunjungan terakhir di Asiyah Baby Spa. Bagaimana kabar si kecil? Kami ada slot minggu ini kalau Bunda ingin dijadwalkan lagi 😊')])});
const s30=iso(addD(T,-29)),sold={};r.filter(x=>dd(x)>=s30).forEach(x=>{try{JSON.parse(x.item||'[]').forEach(i=>sold[i.nama]=(sold[i.nama]||0)+ +i.qty)}catch(e){}});
const dead=P().filter(p=>!sold[p.nama]),tp1=Object.entries(sold).sort((a,b)=>b[1]-a[1])[0];
if(tp1)L.push({s:0,i:'⭐',c:'#f5a623',t:'Andalan: '+tp1[0],d:'Terjual '+tp1[1]+'× dalam 30 hari. Pastikan jadwal terapis siap dan jadikan dasar paket bundling.',a:[]});
if(tp1&&dead.length>2)L.push({s:0,i:'🧊',c:'#2f9fd8',t:dead.length+' layanan belum laku 30 hari',d:dead.slice(0,4).map(p=>p.nama).join(', ')+(dead.length>4?', dll':'')+'. Pertimbangkan promo, bundling, atau sembunyikan dari daftar.',a:D.admin?[['Kelola produk','go','kel']]:[]});
if(new Set(r.map(dd)).size>=14){const wd=[0,0,0,0,0,0,0];r.forEach(x=>wd[new Date(dd(x)+'T12:00').getDay()]++);const av=wd.map(v=>v/8.5),mx=av.indexOf(Math.max(...av)),mn=av.indexOf(Math.min(...av));if(av[mx]>=av[mn]*1.8)L.push({s:0,i:'📅',c:'#3aae93',t:DAYN[mn]+' paling sepi, '+DAYN[mx]+' paling ramai',d:'Rata-rata '+av[mn].toFixed(1)+' vs '+av[mx].toFixed(1)+' transaksi per hari. Coba promo khusus hari '+DAYN[mn]+' untuk meratakan jadwal terapis.',a:[]})}
const kos=r.filter(x=>!x.terapis).length;if(kos/r.length>.2)L.push({s:1,i:'📝',c:'#ef6a5b',t:Math.round(kos/r.length*100)+'% transaksi tanpa terapis',d:'Komisi dan performa terapis jadi tidak akurat. Pilih terapis di keranjang sebelum menyimpan.',a:[]});
const tm={};r.forEach(x=>{if(x.terapis)tm[x.terapis]=(tm[x.terapis]||0)+(+x.total||0)});const bt=Object.entries(tm).sort((a,b)=>b[1]-a[1])[0];
if(bt&&Object.keys(tm).length>2&&bt[1]/tot>.4)L.push({s:0,i:'🧑‍⚕️',c:'#ec6fa0',t:bt[0]+' menyumbang '+Math.round(bt[1]/tot*100)+'% omzet',d:'Pantau beban kerjanya dan siapkan terapis cadangan agar layanan tidak terhambat saat ia berhalangan.',a:[]});
const sb=sum(r,'subtotal'),dk=sum(r,'diskon');if(sb&&dk/sb>.08)L.push({s:1,i:'🏷️',c:'#d23b3b',t:'Diskon '+Math.round(dk/sb*100)+'% dari penjualan',d:'Total '+rp(dk)+' dalam 60 hari. Tetapkan batas diskon per kasir atau ganti dengan bonus layanan.',a:[]});
return L.sort((a,b)=>b.s-a.s)}
function bell(){const b=$('bd');if(!b)return;const n=INS.l.filter(x=>x.s>0).length;b.textContent=n;b.style.display=n?'block':'none'}
function insStrip(){const l=D.admin?INS.l.slice(0,4):[];return l.length?`<div class="is">${l.map(x=>`<button class="ik" style="--c:${x.c}" onclick="insOpen()"><span>${x.i}</span><b>${esc(x.t)}</b></button>`).join('')}</div>`:''}

// ---- PELANGGAN (sinkron CRM) & INPUT FLEKSIBEL ----
let CRM=JSON.parse(LS.crm||'{"t":0,"l":[]}'),SG=[];
const cbo=(id,ph,l,v)=>`<input id="${id}" list="dl${id}" placeholder="${ph} (pilih / ketik)" value="${esc(v)}" autocomplete="off"><datalist id="dl${id}">${(l||[]).map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`;
async function crmLoad(f){if(f!==1&&Date.now()-CRM.t<216e5)return;try{const l=await api('pelanggan');CRM={t:Date.now(),l};try{LS.crm=JSON.stringify(CRM)}catch(e){}if($('sg'))crmSug()}catch(e){}}
function crmSug(){const g=$('sg');if(!g)return;const a=($('nm').value||'').trim().toLowerCase(),b=($('hp').value||'').replace(/\D/g,'').replace(/^0/,'62');
if(a.length<2&&b.length<4){g.innerHTML='<div class="m">👥 '+CRM.l.length+' pelanggan unik dari CRM · ketik nama atau HP untuk mencari <a href="#" onclick="crmLoad(1);return false">↻</a></div>';return}

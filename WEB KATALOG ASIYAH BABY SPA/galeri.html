<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Galeri Asiyah (admin)</title>
<style>:root{--bg:#f1f9fd;--cd:#fff;--ink:#1d3340;--mut:#5f7886;--ln:#dcecf3;--pr:#2f9fd8;--bad:#d23b3b}@media(prefers-color-scheme:dark){:root{--bg:#0c1820;--cd:#16262f;--ink:#e8f3f8;--mut:#9ab3bf;--ln:#26404c}}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--ink)}header{padding:14px 16px;background:linear-gradient(120deg,#2f9fd8,#3aae93);color:#fff;position:sticky;top:0;z-index:2}header b{font-size:17px}
main{max-width:900px;margin:0 auto;padding:12px}.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}button,select,input{font:inherit}button{border:0;border-radius:12px;padding:10px 14px;font-weight:700;background:var(--pr);color:#fff}button.o{background:var(--ln);color:var(--ink)}button.x{background:none;color:var(--bad)}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}.c{background:var(--cd);border:1px solid var(--ln);border-radius:16px;padding:10px}.c img{width:100%;height:170px;object-fit:cover;border-radius:12px;background:var(--ln)}.c input,.c select{width:100%;margin-top:6px;padding:8px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--ink);box-sizing:border-box}.r{display:flex;gap:6px;align-items:center}.m{color:var(--mut);font-size:13px}.pv{background:var(--cd);border:1px solid var(--ln);border-radius:16px;padding:10px;margin-bottom:12px}.pv .hr{display:flex;gap:6px}.pv .hr img{flex:1;min-width:0;height:70px;object-fit:cover;border-radius:10px}.pv .st{display:flex;gap:8px;overflow-x:auto;margin-top:8px}.pv figure{margin:0;flex:none}.pv figure img{height:110px;border-radius:12px;display:block}.pv figcaption{font-size:11px;color:var(--mut);margin-top:3px;max-width:150px}
</style></head><body>
<header><b>🖼️ Galeri dan foto katalog</b></header><main>
<p class="m">Foto diunggah ke Google Drive dan tampil di katalog. Slot <b>Galeri</b> = daftar foto di bagian "Suasana layanan kami". Slot Foto utama, Foto lingkaran, dan Foto outlet menggantikan gambar di bagian atas katalog. Jika belum ada foto di slot Galeri, katalog memakai foto bawaan.</p>
<div class="bar"><button id="add">➕ Tambah foto</button><button class="o" id="imp">📥 Impor foto bawaan katalog</button><button id="sv">💾 Simpan</button><span id="st" class="m"></span></div><input type="file" id="fi" accept="image/*" multiple hidden>
<div id="stg"></div><div id="pv"></div><div class="g" id="g"></div><h3 id="dh" class="m" style="margin:18px 0 6px"></h3><div class="g" id="dg"></div></main>
<script>
var APP="https://script.google.com/macros/s/AKfycbxLi633P0qsM3lI92uB-AdWbEjb3oRbFDxhLr9FMBbGWlJ0Jnu561OCEhCssFXdn3cM/exec",K=sessionStorage.gk||"",L=[],$=function(i){return document.getElementById(i)},SL={galeri:"Galeri",hero:"Foto utama",front:"Foto lingkaran",outlet:"Foto outlet"};
function esc(t){return String(t==null?"":t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function api(b){b.k=K;return fetch(APP,{method:"POST",body:JSON.stringify(b)}).then(function(r){return r.json()}).then(function(r){if(r.error)throw new Error(r.error);return r.d})}
function st(t){$("st").textContent=t}
function draw(){L.sort(function(a,b){return(+a.urutan||0)-(+b.urutan||0)});$("g").innerHTML=L.map(function(x,i){return'<div class="c"><img src="'+esc(x.url)+'" alt=""><input data-i="'+i+'" data-f="judul" placeholder="Keterangan foto" value="'+esc(x.judul)+'"><div class="r"><select data-i="'+i+'" data-f="slot">'+Object.keys(SL).map(function(k){return'<option value="'+k+'"'+(x.slot==k?" selected":"")+'>'+SL[k]+'</option>'}).join("")+'</select><input data-i="'+i+'" data-f="urutan" type="number" style="width:70px" value="'+(x.urutan||0)+'" title="Urutan"></div><div class="r" style="margin-top:6px"><label><input type="checkbox" data-i="'+i+'" data-f="aktif"'+(x.aktif===true||x.aktif==="TRUE"?" checked":"")+' style="width:auto"> Tampil</label><button class="x" data-del="'+i+'">Hapus</button></div></div>'}).join("")||'<p class="m">Belum ada foto yang diatur dari admin. Foto bawaan katalog ditampilkan di bawah.</p>';drawPv();drawDef()}
$("g").addEventListener("input",function(e){var t=e.target,i=t.dataset.i;if(i==null)return;L[i][t.dataset.f]=t.type=="checkbox"?t.checked:t.value});
$("g").addEventListener("click",function(e){var i=e.target.dataset.del;if(i!=null&&confirm("Hapus foto ini dari katalog? (file tetap ada di Drive)")){L.splice(+i,1);draw()}});
function save(){return api({api:"adminSave",n:"Galeri",list:L.map(function(x){return{aktif:x.aktif===true||x.aktif==="TRUE",urutan:+x.urutan||0,slot:x.slot||"galeri",judul:x.judul||"",url:x.url,fid:x.fid||""}})})}
function load(){st("Memuat…");api({api:"galeriGet"}).then(function(r){L=r;draw();st("")}).catch(function(e){if(/kunci/i.test(e.message)){sessionStorage.gk=K=prompt("Kunci admin:")||"";if(K)load()}else st(e.message)})}
// kecilkan foto di perangkat sebelum diunggah
function shrink(file){return new Promise(function(ok,no){var im=new Image();im.onload=function(){var s=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.8).split(",")[1])};im.onerror=no;im.src=URL.createObjectURL(file)})}
function up(b64,name,mime,slot,judul){return api({api:"galeriUpload",name:name,mime:mime,data:b64}).then(function(r){L.push({aktif:true,urutan:L.reduce(function(m,x){return Math.max(m,+x.urutan||0)},0)+1,slot:slot||"galeri",judul:judul||"",url:r.url,fid:r.fid})})}
$("add").onclick=function(){$("fi").click()};
var S=[];
$("fi").onchange=function(){[].slice.call(this.files).forEach(function(f){S.push({f:f,u:URL.createObjectURL(f),judul:f.name.replace(/\.\w+$/,""),slot:"galeri"})});this.value="";drawS()};
function drawS(){$("stg").innerHTML=S.length?'<div class="pv"><b>Pratinjau sebelum diunggah ('+S.length+' foto)</b><div class="g" style="margin-top:8px">'+S.map(function(x,i){return'<div class="c"><img src="'+x.u+'" alt=""><input data-s="'+i+'" data-f="judul" value="'+esc(x.judul)+'" placeholder="Keterangan foto"><select data-s="'+i+'" data-f="slot">'+Object.keys(SL).map(function(k){return'<option value="'+k+'"'+(x.slot==k?" selected":"")+'>'+SL[k]+'</option>'}).join("")+'</select><button class="x" data-sd="'+i+'">Buang</button></div>'}).join("")+'</div><div class="bar" style="margin-top:10px"><button id="go">⬆ Unggah '+S.length+' foto</button><button class="o" id="cl">Batal</button></div></div>':""}
$("stg").addEventListener("input",function(e){var i=e.target.dataset.s;if(i!=null)S[i][e.target.dataset.f]=e.target.value});
$("stg").addEventListener("change",function(e){var i=e.target.dataset.s;if(i!=null)S[i][e.target.dataset.f]=e.target.value});
$("stg").addEventListener("click",async function(e){var t=e.target;if(t.dataset.sd!=null){S.splice(+t.dataset.sd,1);drawS()}else if(t.id=="cl"){S=[];drawS()}else if(t.id=="go"){t.disabled=true;try{for(var i=0;i<S.length;i++){st("Mengunggah "+(i+1)+"/"+S.length+"…");await up(await shrink(S[i].f),S[i].judul.slice(0,40)+".jpg","image/jpeg",S[i].slot,S[i].judul)}await save();S=[];drawS();draw();st("Tersimpan ✓")}catch(er){st(er.message||"Gagal");t.disabled=false}}});
var DEF=[["hero","hero","Foto utama"],["front","front","Foto lingkaran"],["outlet","outlet","Tampak depan outlet"],["recep","galeri","Area resepsionis dan mural pelangi"],["room1","galeri","Ruang baby spa dan terapi"],["room2","galeri","Area pijat dan senam bayi"],["nbm","galeri","Memandikan bayi baru lahir"],["nbj1","galeri","Menjemur bayi dengan pelindung mata"],["nbj2","galeri","Menjemur bayi di nest"],["nbi","galeri","Terapi sinar infrared"],["cuc","galeri","Baby spa"],["mas","galeri","Pijat bayi"],["g1","galeri",""],["g2","galeri",""],["g3","galeri",""],["g4","galeri",""],["g5","galeri",""],["g6","galeri",""]];
$("imp").onclick=async function(){if(L.length&&!confirm("Daftar sudah berisi foto. Impor tetap menambah foto bawaan di bawahnya. Lanjut?"))return;try{st("Membaca katalog…");var t=await (await fetch("index.html",{cache:"no-store"})).text();for(var i=0;i<DEF.length;i++){var m=t.match(new RegExp('"'+DEF[i][0]+'":\\s?"data:image/([a-z]+);base64,([^"]+)"'));if(!m)continue;st("Mengunggah "+(i+1)+"/"+DEF.length+"…");await up(m[2],DEF[i][0]+"."+m[1],"image/"+m[1],DEF[i][1],DEF[i][2])}await save();draw();st("Impor selesai ✓")}catch(e){st(e.message||"Gagal")}};
$("sv").onclick=function(){st("Menyimpan…");save().then(function(){st("Tersimpan ✓ (katalog diperbarui dalam beberapa detik)")}).catch(function(e){st(e.message)})};
var DEFS={};
function loadDefs(){fetch("index.html",{cache:"no-store"}).then(function(r){return r.text()}).then(function(t){DEF.forEach(function(d){var m=t.match(new RegExp('"'+d[0]+'":\\s?"(data:image/[a-z]+;base64,[^"]+)"'));if(m)DEFS[d[0]]=m[1]});drawPv();drawDef()}).catch(function(){})}
function drawDef(){var on=!L.length;$("dh").textContent=on?"Foto bawaan katalog (sedang tampil di katalog, belum diatur dari admin)":"";$("dg").innerHTML=on?DEF.filter(function(d){return DEFS[d[0]]}).map(function(d){return'<div class="c"><img src="'+DEFS[d[0]]+'" alt=""><div class="m" style="margin:6px 0">'+esc(d[2]||"Foto galeri")+" · "+SL[d[1]]+'</div><button class="o" data-imp="'+d[0]+'">Atur dari admin</button></div>'}).join(""):""}
$("dg").addEventListener("click",async function(e){var k=e.target.dataset.imp;if(!k)return;var d=DEF.filter(function(x){return x[0]==k})[0],m=DEFS[k].match(/^data:image\/([a-z]+);base64,(.+)$/);e.target.disabled=true;try{st("Mengunggah…");await up(m[2],k+"."+m[1],"image/"+m[1],d[1],d[2]);await save();draw();st("Tersimpan ✓")}catch(er){st(er.message||"Gagal");e.target.disabled=false}});
function drawPv(){var src=L.length?L.filter(function(x){return x.aktif===true||x.aktif==="TRUE"}):DEF.filter(function(d){return DEFS[d[0]]}).map(function(d){return{slot:d[1],judul:d[2],url:DEFS[d[0]]}}),sl=function(s){var x=src.filter(function(y){return y.slot==s})[0];return x?x.url:""},gl=src.filter(function(x){return x.slot=="galeri"});
$("pv").innerHTML='<div class="pv"><b>👁️ Pratinjau di katalog</b><div class="hr" style="margin-top:8px">'+["hero","front","outlet"].map(function(s){return sl(s)?'<img src="'+esc(sl(s))+'" alt="'+SL[s]+'">':""}).join("")+'</div><div class="st">'+gl.map(function(x){return'<figure><img src="'+esc(x.url)+'" alt=""><figcaption>'+esc(x.judul)+"</figcaption></figure>"}).join("")+"</div></div>"}
if(!K){K=prompt("Kunci admin:")||"";sessionStorage.gk=K}loadDefs();load();
</script></body></html>
